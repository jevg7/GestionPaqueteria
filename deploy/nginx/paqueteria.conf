# Nginx: frontend (archivos estáticos) y API (proxy a Kestrel) en el mismo dominio, así no hace falta CORS.
# Guía: docs/despliegue.md. Antes de copiarlo a /etc/nginx/sites-available/paqueteria, reemplazar:
#   __DOMINIO__            el dominio, sin www (p. ej. midominio.com)
#   __PROYECTO_SUPABASE__  la referencia del proyecto de Supabase (la parte de https://<ref>.supabase.co)
# Los certificados los obtiene certbot antes de activar este sitio. "listen ... http2" y no "http2 on": Ubuntu 24.04 trae
# Nginx 1.24, que no conoce esa directiva (las versiones nuevas solo avisan que la otra forma es antigua).

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__ www.__DOMINIO__;
    return 301 https://__DOMINIO__$request_uri;
}

# www → sin www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://__DOMINIO__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad para todo el sitio. Ninguna location usa add_header: si alguna lo hiciera, dejaría de
    # heredar estas (regla de Nginx). La CSP solo deja hablar al navegador con este dominio y con Supabase Auth.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://__PROYECTO_SUPABASE__.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /var/www/paqueteria;
    index index.html;

    # API: Kestrel solo escucha en loopback. La API toma el esquema y la IP del cliente de estas cabeceras
    # (Program.cs: UseForwardedHeaders, solo desde loopback).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos de Vite con hash en el nombre: cambian con cada versión, así que se guardan un año.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas del frontend (/clientes/12…): todas sirven index.html, sin caché para que cada versión llegue al instante.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
